<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO & Identity -->
  <title>DAEM | My Applications</title>
  <meta name="description" content="DAEM - Official Applications & Tools Hub.">
  <meta name="keywords" content="DAEM, دايم, My Applications, Apps, Software">
  <meta name="author" content="DAEM">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="DAEM | My Applications">
  <meta property="og:description" content="DAEM - Applications & Tools Hub">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://abdullhfadel2001-cloud.github.io/ALL-WEB/">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Electric Background Layers -->
  <div class="bg-layer">
    <div class="stars"></div>
    <div class="lightning-bg" id="lightningBg"></div>
    <div class="grid-overlay"></div>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <div class="nav-inner">
      <div class="logo">
        <div class="logo-bolt">⚡</div>
        <div class="logo-text">
          <span class="logo-daem">DAEM</span>
        </div>
      </div>
      <button id="addAppNavBtn" class="btn-electric-sm">
        <span>➕</span> Add App
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <div class="electric-badge">⚡ DIGITAL HUB ⚡</div>
      <h1 class="hero-title">
        <span class="glitch" data-text="DAEM">DAEM</span>
      </h1>
      <p class="hero-subtitle">Welcome to my personal digital platform for software, tools, and projects.</p>
      <div class="hero-cta-row">
        <a href="#apps" class="btn-electric">
          <span class="btn-bolt">⚡</span>
          My Applications
        </a>
      </div>
    </div>

    <div class="hero-visual">
      <div class="orb-container">
        <div class="orb"></div>
        <div class="orb-ring orb-ring-1"></div>
        <div class="orb-ring orb-ring-2"></div>
        <div class="orb-ring orb-ring-3"></div>
        <div class="orb-bolt">⚡</div>
      </div>
    </div>
  </section>

  <!-- MY APPLICATIONS SECTION -->
  <section class="apps-section" id="apps">
    <div class="section-container">
      <div class="section-header">
        <div class="section-badge">EXPLORE</div>
        <h2 class="section-title"><span class="electric-word">My Applications</span></h2>
        <p class="section-desc">Download and discover apps created by DAEM</p>

        <!-- Search & Filter Bar -->
        <div class="search-filter-bar">
          <div class="search-input-wrap">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search applications...">
          </div>
          <div class="filter-tabs" id="filterTabs">
            <button class="ftab active" data-cat="all">All</button>
            <button class="ftab" data-cat="android">Android</button>
            <button class="ftab" data-cat="tools">Tools</button>
            <button class="ftab" data-cat="games">Games</button>
            <button class="ftab" data-cat="web">Web</button>
          </div>
        </div>
      </div>

      <!-- Apps Grid -->
      <div class="apps-grid" id="appsGrid">
        <!-- Rendered via JavaScript -->
      </div>

      <!-- Add New App Action -->
      <div class="add-app-row">
        <button id="addAppBtn" class="btn-add-app">
          <span>⚡</span> Add New App
        </button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-logo">
        <span>⚡</span> <strong>DAEM</strong>
      </div>
      <p class="footer-text">© 2026 DAEM · All Rights Reserved ⚡</p>
    </div>
  </footer>

  <!-- Modal: Add New App -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-box">
      <div class="modal-title">
        <span>⚡</span> Add New Application
        <button id="closeModal" class="modal-close">✕</button>
      </div>
      <form id="addAppForm">
        <div class="fgroup">
          <label>App Name</label>
          <input type="text" id="fName" placeholder="e.g. My Next Project" required>
        </div>
        <div class="frow">
          <div class="fgroup">
            <label>Category</label>
            <select id="fCat">
              <option value="android">📱 Android</option>
              <option value="tools">🛠️ Tools</option>
              <option value="games">🎮 Games</option>
              <option value="web">🌐 Web App</option>
            </select>
          </div>
          <div class="fgroup">
            <label>Icon (Emoji)</label>
            <input type="text" id="fIcon" placeholder="🚀" value="🚀">
          </div>
        </div>
        <div class="frow">
          <div class="fgroup">
            <label>Version</label>
            <input type="text" id="fVersion" placeholder="v1.0.0" value="v1.0.0">
          </div>
          <div class="fgroup">
            <label>File Size</label>
            <input type="text" id="fSize" placeholder="10 MB">
          </div>
        </div>
        <div class="fgroup">
          <label>Description</label>
          <textarea id="fDesc" rows="3" placeholder="Brief description of the app..." required></textarea>
        </div>
        <div class="fgroup">
          <label>Download URL / File Link</label>
          <input type="text" id="fUrl" placeholder="downloads/app.apk or https://..." required>
        </div>
        <div class="fgroup">
          <label>Demo / Live Preview URL (optional)</label>
          <input type="text" id="fDemo" placeholder="https://... or leave empty">
        </div>
        <div class="modal-actions">
          <button type="button" id="cancelModal" class="btn-ghost-sm">Cancel</button>
          <button type="submit" class="btn-electric-sm"><span>⚡</span> Save App</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <script src="script.js"></script>
</body>
</html>
