<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Inner Glow Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="12 8" opacity="0.4"/>

  <!-- Mosque Silhouette -->
  <!-- Base -->
  <rect x="136" y="270" width="240" height="130" rx="12" fill="#ffffff"/>
  
  <!-- Main Dome -->
  <path d="M 176 270 C 176 180, 336 180, 336 270 Z" fill="#ffffff"/>
  
  <!-- Crescent & Star -->
  <path d="M 256 120 A 25 25 0 1 0 278 155 A 20 20 0 1 1 256 120 Z" fill="url(#gold)"/>
  <circle cx="270" cy="132" r="4" fill="url(#gold)"/>

  <!-- Left Minaret -->
  <rect x="100" y="210" width="24" height="190" rx="6" fill="#f8fafc"/>
  <path d="M 96 210 L 112 170 L 128 210 Z" fill="url(#gold)"/>

  <!-- Right Minaret -->
  <rect x="388" y="210" width="24" height="190" rx="6" fill="#f8fafc"/>
  <path d="M 384 210 L 400 170 L 416 210 Z" fill="url(#gold)"/>

  <!-- Door -->
  <path d="M 230 400 L 230 330 C 230 310, 282 310, 282 330 L 282 400 Z" fill="#047857"/>
  
  <!-- Stars -->
  <circle cx="160" cy="150" r="5" fill="url(#gold)" opacity="0.8"/>
  <circle cx="350" cy="150" r="5" fill="url(#gold)" opacity="0.8"/>
  <circle cx="200" cy="120" r="3.5" fill="url(#gold)" opacity="0.6"/>
  <circle cx="312" cy="120" r="3.5" fill="url(#gold)" opacity="0.6"/>
</svg>

